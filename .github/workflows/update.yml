name: Automatic Schedule Update

on:
  # Автоматический запуск каждый день в 09:00 по времени Алтайского края
  schedule:
    - cron: "0 2 * * *"

  # Возможность запустить вручную
  workflow_dispatch:

  # Запуск после изменения файлов сборщика
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      # Получаем файлы репозитория
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Устанавливаем библиотеки
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Устанавливаем часовой пояс Алтайского края
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone Asia/Barnaul

      # Ищем и собираем расписание
      - name: Build schedule
        run: |
          python scripts/build_schedule.py

      # Проверяем JSON
      - name: Validate schedule
        run: |
          python -m json.tool schedule.json > /dev/null
          echo "Расписание прошло проверку JSON"

      # Сохраняем обновлённое расписание в GitHub
      - name: Commit updated schedule
        run: |
          git config user.name "AASK Schedule Bot"
          git config user.email "aask-schedule-bot@users.noreply.github.com"

          git add schedule.json

          if git diff --cached --quiet; then
            echo "Расписание не изменилось."
          else
            git commit -m "Automatic schedule update"
            # ВАЖНО: Подтягиваем изменения, чтобы избежать ошибки "rejected"
            git pull --rebase origin main
            git push
            echo "Новое расписание опубликовано в GitHub."
          fi
