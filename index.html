<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание · ААСК</title>
<meta name="theme-color" content="#1d2330">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AASK SCHEDULE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --mute: #86868b;
  --line: #e5e5ea; --mark: #f2b705; --markink: #1d1d1f; --steel: #0071e3;
  --shadow: 0 4px 24px rgba(0,0,0,0.06); --radius: 16px;
}
[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --mute: #86868b;
  --line: #38383a; --mark: #f2b705; --markink: #000000; --steel: #2997ff;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 Onest, system-ui, -apple-system, sans-serif;
  min-height: 100vh; transition: background 0.3s, color 0.3s;
}
main { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; }

h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
.sub { margin-top: 6px; color: var(--mute); font-size: 15px; font-weight: 500; }

button { font: inherit; cursor: pointer; color: inherit; border: none; background: none; transition: all 0.2s; }
.link { color: var(--steel); font-weight: 600; padding: 8px 0; display: inline-block; }

.tabs { display: flex; gap: 4px; margin: 20px 0; padding: 4px; background: var(--line); border-radius: 12px; }
.tabs button { flex: 1; padding: 10px; border-radius: 10px; color: var(--mute); font-weight: 600; font-size: 15px; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.search { width: 100%; margin: 16px 0 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.chips button { padding: 14px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 600; }

.dayhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 12px; }
.dayhead h2 { font-size: 22px; font-weight: 700; }
.dayhead small { display: block; color: var(--mute); font-size: 14px; margin-top: 2px; }

.nav { display: flex; gap: 8px; }
.nav button { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: grid; place-items: center; font-size: 20px; }
.nav button:disabled { opacity: 0.3; cursor: default; }

.lesson { display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 16px; margin-bottom: 10px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); }
.num { display: grid; place-items: center; height: 56px; border-radius: 12px; background: var(--mark); color: var(--markink); font-size: 24px; font-weight: 800; }
.subject { font-weight: 600; font-size: 17px; margin-bottom: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--mute); font-size: 14px; }

.room { padding: 4px 10px; border-radius: 8px; background: var(--line); font-weight: 600; font-size: 13px; }
.tag { padding: 4px 10px; border-radius: 8px; background: rgba(0, 113, 227, 0.1); color: var(--steel); font-weight: 600; font-size: 13px; }

.note, .empty { padding: 20px; border-radius: var(--radius); background: var(--card); color: var(--mute); text-align: center; font-weight: 500; margin-bottom: 16px; }

.top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 20; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 20px; border: 1px solid var(--line); }

footer { margin-top: 40px; font-size: 13px; color: var(--mute); text-align: center; }
footer a { color: var(--steel); text-decoration: none; }
</style>
</head>
<body>

<div class="top-controls">
  <button class="icon-btn" id="themeToggle">🌙</button>
</div>

<main>
  <h1 id="title">Расписание ААСК</h1>
  <p class="sub" id="sub">Алтайский архитектурно-строительный колледж</p>
  <div id="app"><div class="empty">Загружаю расписание…</div></div>
</main>

<script>
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme');
if (currentTheme) {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  themeToggle.textContent = isDark ? '🌙' : '☀️';
});

const BELLS = {
  mon: {1:['8:45','10:15'],2:['10:25','12:05'],3:['12:50','14:20'],4:['14:40','16:10'],5:['16:15','17:45']},
  std: {1:['8:00','9:30'],2:['9:35','11:15'],3:['11:35','13:15'],4:['13:35','15:05'],5:['15:25','16:55'],6:['17:00','18:30']}
};
const bellsFor = w => w === 'понедельник' ? BELLS.mon : (['суббота','воскресенье'].includes(w) ? {} : BELLS.std);
const norm = s => s.toLowerCase().replace(/[^a-zа-яё0-9]/g,'');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

const app = document.getElementById('app');
let data, group = null, mode = 'day', dates = [], idx = 0;

function pickGroup(g) {
  group = g; localStorage.setItem('group', g);
  mode = 'day';
  idx = dates.findIndex(k => k >= iso(new Date()));
  if (idx === -1) idx = dates.length - 1;
  show();
}

function show() {
  if (!group) {
    document.getElementById('title').textContent = 'Расписание ААСК';
    document.getElementById('sub').style.display = 'block';
    app.replaceChildren();
    const inp = el('input', 'search'); inp.placeholder = 'Найдите группу...';
    const chips = el('div', 'chips');
    const draw = () => {
      chips.replaceChildren();
      data.groups.filter(g => norm(g).includes(norm(inp.value))).forEach(g => {
        const b = el('button', null, g); b.onclick = () => pickGroup(g); chips.appendChild(b);
      });
    };
    inp.oninput = draw; app.append(inp, chips); draw();
    return;
  }

  document.getElementById('title').textContent = 'Расписание ' + group;
  document.getElementById('sub').style.display = 'none';
  app.replaceChildren();

  const ch = el('button', 'link', '← Сменить группу'); ch.onclick = () => { group = null; show(); }; app.appendChild(ch);

  const tabs = el('div', 'tabs');
  [['day', 'Сегодня'], ['week', 'Неделя'], ['news', 'Новости']].forEach(([m, t]) => {
    const b = el('button', null, t); b.setAttribute('aria-selected', mode === m);
    b.onclick = () => { mode = m; show(); }; tabs.appendChild(b);
  });
  app.appendChild(tabs);

  if (!dates.length) { app.appendChild(el('div', 'empty', 'Нет данных.')); return; }
  const t = iso(new Date());

  if (mode === 'day') {
    const key = dates[idx], day = data.days[key];
    const head = el('div', 'dayhead'), h = el('h2', null, cap(day.weekday) + ', ' + fmt(key));
    h.appendChild(el('small', null, day.week + '-я неделя')); head.appendChild(h);
    const nav = el('div', 'nav'), p = el('button', null, '‹'), n = el('button', null, '›');
    p.disabled = idx === 0; n.disabled = idx >= dates.length - 1;
    p.onclick = () => { idx--; show(); }; n.onclick = () => { idx++; show(); };
    nav.append(p, n); head.appendChild(nav); app.appendChild(head);
    
    const ls = data.days[key].groups[group] || [];
    if (!ls.length) app.appendChild(el('div', 'empty', 'Занятий нет.'));
    ls.forEach(l => {
      const c = el('div', 'lesson'); c.appendChild(el('div', 'num', l.n));
      const b = el('div'); b.appendChild(el('div', 'subject', l.s));
      const m = el('div', 'meta'); if (l.r) m.appendChild(el('span', 'room', 'ауд. ' + l.r)); if (l.t) m.appendChild(el('span', null, l.t));
      b.appendChild(m); c.appendChild(b); app.appendChild(c);
    });
  } else if (mode === 'week') {
    const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)), sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    let list = dates.filter(k => k >= iso(mon) && k <= iso(sun)); if (!list.length) list = dates.slice(-7);
    list.forEach(k => { const d = data.days[k];
      app.appendChild(el('h2', null, cap(d.weekday) + ', ' + fmt(k))).style.cssText = 'margin: 20px 0 10px; font-size: 18px;';
      const ls = data.days[k].groups[group] || []; if (!ls.length) app.appendChild(el('div', 'empty', 'Занятий нет.'));
      ls.forEach(l => {
        const c = el('div', 'lesson'); c.appendChild(el('div', 'num', l.n));
        const b = el('div'); b.appendChild(el('div', 'subject', l.s));
        const m = el('div', 'meta'); if (l.r) m.appendChild(el('span', 'room', 'ауд. ' + l.r)); if (l.t) m.appendChild(el('span', null, l.t));
        b.appendChild(m); c.appendChild(b); app.appendChild(c);
      });
    });
  } else if (mode === 'news') {
    if (!data.news || !data.news.length) {
      app.appendChild(el('div', 'empty', 'Пока новостей нет.'));
    } else {
      data.news.forEach(n => {
        const c = el('div', 'lesson'); c.style.gridTemplateColumns = '1fr';
        const b = el('div'); 
        const d = el('div', null, n.date); d.style.cssText = 'font-size:13px; color:var(--steel); font-weight:700; margin-bottom:4px;';
        b.appendChild(d); b.appendChild(el('div', 'subject', n.text));
        c.appendChild(b); app.appendChild(c);
      });
    }
  }
}

fetch('schedule.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    data = j;
    dates = Object.keys(j.days || {}).sort();
    data.groups = (j.groups || []).sort();
    const saved = localStorage.getItem('group');
    if (saved && data.groups.includes(saved)) group = saved;
    show();
  })
  .catch(e => {
    app.replaceChildren(el('div', 'empty', 'Ошибка загрузки данных: ' + e.message));
  });
</script>
</body>
</html>
