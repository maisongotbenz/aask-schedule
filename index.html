<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание · ААСК</title>
<meta name="theme-color" content="#1d2330">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AASK SCHEDULE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --mute: #86868b;
  --line: #e5e5ea; --mark: #f2b705; --markink: #1d1d1f; --steel: #0071e3;
  --shadow: 0 4px 24px rgba(0,0,0,0.06); --radius: 16px;
  --green: #34c759; --red: #ff3b30;
}
[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --ink: #f5f5f7; --mute: #86868b;
  --line: #38383a; --mark: #f2b705; --markink: #000000; --steel: #2997ff;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 Onest, system-ui, -apple-system, sans-serif;
  min-height: 100vh; transition: background 0.3s, color 0.3s;
}
main { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; }

h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
.sub { margin-top: 6px; color: var(--mute); font-size: 15px; font-weight: 500; }

button { font: inherit; cursor: pointer; color: inherit; border: none; background: none; transition: all 0.2s; }
.link { color: var(--steel); font-weight: 600; padding: 8px 0; display: inline-block; }

.tabs { display: flex; gap: 4px; margin: 20px 0; padding: 4px; background: var(--line); border-radius: 12px; overflow-x: auto; }
.tabs button { flex: 1; padding: 10px; border-radius: 10px; color: var(--mute); font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

.search { width: 100%; margin: 16px 0 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.chips button { padding: 14px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 600; }

.dayhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 12px; }
.dayhead h2 { font-size: 22px; font-weight: 700; }
.dayhead small { display: block; color: var(--mute); font-size: 14px; margin-top: 2px; }

.nav { display: flex; gap: 8px; }
.nav button { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: grid; place-items: center; font-size: 20px; }
.nav button:disabled { opacity: 0.3; cursor: default; }

/* Карточка пары */
.lesson { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; padding: 16px; margin-bottom: 10px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); transition: border-color 0.2s; }
.lesson.attended { border-color: var(--green); background: rgba(52, 199, 89, 0.05); }
.lesson.missed { border-color: var(--red); background: rgba(255, 59, 48, 0.05); }

.num { display: grid; place-items: center; height: 56px; border-radius: 12px; background: var(--mark); color: var(--markink); font-size: 24px; font-weight: 800; }
.subject { font-weight: 600; font-size: 17px; margin-bottom: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--mute); font-size: 14px; }
.time { font-size: 13px; color: var(--steel); font-weight: 700; margin-bottom: 4px; }
.room { padding: 4px 10px; border-radius: 8px; background: var(--line); font-weight: 600; font-size: 13px; }
.tag { padding: 4px 10px; border-radius: 8px; background: rgba(0, 113, 227, 0.1); color: var(--steel); font-weight: 600; font-size: 13px; }

/* Кнопки отметок */
.mark-buttons { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.mark-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 16px; opacity: 0.6; }
.mark-btn:hover { opacity: 1; transform: scale(1.05); }
.mark-btn.active { opacity: 1; border-color: transparent; }
.mark-btn.attended-btn.active { background: var(--green); color: #fff; }
.mark-btn.missed-btn.active { background: var(--red); color: #fff; }

.note, .empty { padding: 20px; border-radius: var(--radius); background: var(--card); color: var(--mute); text-align: center; font-weight: 500; margin-bottom: 16px; }

/* Блок статистики */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card { padding: 16px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); text-align: center; }
.stat-value { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.stat-label { font-size: 13px; color: var(--mute); }
.progress-bar { width: 100%; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 10px; }
.progress-fill { height: 100%; background: var(--green); border-radius: 6px; transition: width 0.5s; }

/* Стили для звонков (ВОЗВРАЩЕНЫ) */
.bell-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; margin-bottom: 10px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); transition: all 0.2s; }
.bell-card.active { border-color: var(--mark); background: rgba(242, 183, 5, 0.05); }
.bell-num { font-size: 20px; font-weight: 800; width: 40px; text-align: center; color: var(--mark); }
.bell-times { display: flex; flex-direction: column; font-weight: 600; font-size: 15px; }
.bell-duration { font-size: 13px; color: var(--mute); font-weight: 400; margin-top: 2px; }
.bell-status { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: var(--line); color: var(--mute); }

/* Стили для Telegram (ВОЗВРАЩЕНЫ) */
.tg-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; margin-bottom: 16px;
  background: #2AABEE; color: #ffffff;
  border-radius: var(--radius); text-decoration: none;
  box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
  transition: transform 0.2s;
}
.tg-card:hover { transform: translateY(-2px); }
.tg-icon { width: 32px; height: 32px; fill: #fff; }
.tg-text { display: flex; flex-direction: column; line-height: 1.3; }
.tg-title { font-weight: 700; font-size: 16px; }
.tg-desc { font-size: 13px; opacity: 0.9; }

.top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 20; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 20px; border: 1px solid var(--line); }

footer { margin-top: 40px; font-size: 13px; color: var(--mute); text-align: center; }
footer a { color: var(--steel); text-decoration: none; }
</style>
</head>
<body>

<div class="top-controls">
  <button class="icon-btn" id="themeToggle">🌙</button>
</div>

<main>
  <h1 id="title">Расписание ААСК</h1>
  <p class="sub" id="sub">Алтайский архитектурно-строительный колледж</p>
  <div id="app"><div class="empty">Загружаю расписание…</div></div>
</main>

<script>
// --- ТЕМА ---
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme');
if (currentTheme) {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  themeToggle.textContent = isDark ? '🌙' : '☀️';
});

// --- ЗВОНКИ ---
const BELLS = {
  mon: {1:['8:45','10:15'],2:['10:25','12:05'],3:['12:50','14:20'],4:['14:40','16:10'],5:['16:15','17:45']},
  std: {1:['8:00','9:30'],2:['9:35','11:15'],3:['11:35','13:15'],4:['13:35','15:05'],5:['15:25','16:55'],6:['17:00','18:30']}
};
const bellsFor = w => w === 'понедельник' ? BELLS.mon : (['суббота','воскресенье'].includes(w) ? {} : BELLS.std);
const norm = s => s.toLowerCase().replace(/[^a-zа-яё0-9]/g,'');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

// --- ХРАНИЛИЩЕ ОТМЕТОК ---
const getAttendance = () => JSON.parse(localStorage.getItem('attendance') || '{}');
const saveAttendance = (data) => localStorage.setItem('attendance', JSON.stringify(data));

function toggleMark(dateKey, lessonNum, status) {
  const att = getAttendance();
  const id = `${dateKey}_${lessonNum}_${group}`;
  
  if (att[id] === status) {
    delete att[id]; // Если нажали повторно - снимаем отметку
  } else {
    att[id] = status;
  }
  saveAttendance(att);
  show(); // Перерисовываем страницу
}

// --- ОСНОВНАЯ ЛОГИКА ---
const app = document.getElementById('app');
let data, group = null, mode = 'news', dates = [], idx = 0;

function pickGroup(g) {
  group = g; localStorage.setItem('group', g);
  mode = 'news';
  idx = dates.findIndex(k => k >= iso(new Date()));
  if (idx === -1) idx = dates.length - 1;
  show();
}

function createLessonCard(lesson, weekday, dateKey) {
  const c = el('div', 'lesson');
  
  const att = getAttendance();
  const id = `${dateKey}_${lesson.n}_${group}`;
  const status = att[id];

  if (status === 'attended') c.classList.add('attended');
  if (status === 'missed') c.classList.add('missed');

  c.appendChild(el('div', 'num', lesson.n));
  
  const b = el('div');
  const bl = bellsFor(weekday)[lesson.n];
  if (bl) {
    b.appendChild(el('div', 'time', bl[0] + '–' + bl[1]));
  }
  b.appendChild(el('div', 'subject', lesson.s));
  const m = el('div', 'meta');
  if (lesson.r) m.appendChild(el('span', 'room', 'ауд. ' + lesson.r));
  if (lesson.t) m.appendChild(el('span', null, lesson.t));
  b.appendChild(m);

  // Кнопки отметок
  const btns = el('div', 'mark-buttons');
  
  const btnAttended = el('button', 'mark-btn attended-btn' + (status === 'attended' ? ' active' : ''), '✅');
  btnAttended.onclick = (e) => { e.stopPropagation(); toggleMark(dateKey, lesson.n, 'attended'); };
  
  const btnMissed = el('button', 'mark-btn missed-btn' + (status === 'missed' ? ' active' : ''), '❌');
  btnMissed.onclick = (e) => { e.stopPropagation(); toggleMark(dateKey, lesson.n, 'missed'); };

  btns.append(btnAttended, btnMissed);
  c.append(b, btns);
  
  return c;
}

function showStats() {
  const att = getAttendance();
  let total = 0, attended = 0, missed = 0;

  if (data && data.days) {
    Object.keys(data.days).forEach(dateKey => {
      const day = data.days[dateKey];
      if (day.groups && day.groups[group]) {
        day.groups[group].forEach(l => {
          const id = `${dateKey}_${l.n}_${group}`;
          if (att[id] === 'attended') attended++;
          if (att[id] === 'missed') missed++;
          total++;
        });
      }
    });
  }

  const percent = total > 0 ? Math.round((attended / (attended + missed || 1)) * 100) : 0;

  app.replaceChildren();
  
  // Кнопка назад
  const backBtn = el('button', 'link', '← Назад к расписанию');
  backBtn.style.marginBottom = '16px';
  backBtn.onclick = () => { mode = 'day'; show(); };
  app.appendChild(backBtn);

  const grid = el('div', 'stats-grid');
  
  const c1 = el('div', 'stat-card');
  c1.innerHTML = `<div class="stat-value">${attended}</div><div class="stat-label">Посещено</div>`;
  
  const c2 = el('div', 'stat-card');
  c2.innerHTML = `<div class="stat-value" style="color: var(--red)">${missed}</div><div class="stat-label">Пропущено</div>`;
  
  grid.append(c1, c2);
  app.appendChild(grid);

  const progCard = el('div', 'stat-card');
  progCard.style.textAlign = 'left';
  progCard.innerHTML = `
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <span style="font-weight: 700;">Посещаемость</span>
        <span style="font-weight: 800; color: var(--steel);">${percent}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%; background: ${percent > 70 ? 'var(--green)' : 'var(--red)'}"></div></div>
    <div style="font-size: 13px; color: var(--mute); margin-top: 10px;">Всего отмечено пар: ${attended + missed} из ${total}</div>
  `;
  app.appendChild(progCard);

  const resetBtn = el('button', 'link', 'Сбросить всю статистику');
  resetBtn.style.color = 'var(--red)';
  resetBtn.style.marginTop = '20px';
  resetBtn.onclick = () => {
    if (confirm('Вы уверены, что хотите удалить все отметки?')) {
      localStorage.removeItem('attendance');
      showStats();
    }
  };
  app.appendChild(resetBtn);
}

function show() {
  if (!group) {
    document.getElementById('title').textContent = 'Расписание ААСК';
    document.getElementById('sub').style.display = 'block';
    app.replaceChildren();
    const inp = el('input', 'search'); inp.placeholder = 'Найдите группу...';
    const chips = el('div', 'chips');
    const draw = () => {
      chips.replaceChildren();
      data.groups.filter(g => norm(g).includes(norm(inp.value))).forEach(g => {
        const b = el('button', null, g); b.onclick = () => pickGroup(g); chips.appendChild(b);
      });
    };
    inp.oninput = draw; app.append(inp, chips); draw();
    return;
  }

  document.getElementById('title').textContent = 'Расписание ' + group;
  document.getElementById('sub').style.display = 'none';
  app.replaceChildren();
  
  const topBar = el('div');
  const ch = el('button', 'link', '← Сменить группу'); ch.onclick = () => { group = null; show(); };
  topBar.appendChild(ch);
  app.appendChild(topBar);

  const tabs = el('div', 'tabs');
  [['news', 'Новости'], ['day', 'Сегодня'], ['week', 'Неделя'], ['bells', 'Звонки'], ['stats', 'Статистика']].forEach(([m, t]) => {
    const b = el('button', null, t); b.setAttribute('aria-selected', mode === m);
    b.onclick = () => { mode = m; show(); }; tabs.appendChild(b);
  });
  app.appendChild(tabs);

  if (mode === 'stats') {
    showStats();
    return;
  }

  if (!dates.length && mode !== 'bells') { app.appendChild(el('div', 'empty', 'Нет данных.')); return; }
  const t = iso(new Date());

  if (mode === 'day') {
    const key = dates[idx], day = data.days[key];
    const head = el('div', 'dayhead'), h = el('h2', null, cap(day.weekday) + ', ' + fmt(key));
    h.appendChild(el('small', null, day.week + '-я неделя')); head.appendChild(h);
    const nav = el('div', 'nav'), p = el('button', null, '‹'), n = el('button', null, '›');
    p.disabled = idx === 0; n.disabled = idx >= dates.length - 1;
    p.onclick = () => { idx--; show(); }; n.onclick = () => { idx++; show(); };
    nav.append(p, n); head.appendChild(nav); app.appendChild(head);
    
    const ls = data.days[key].groups[group] || [];
    if (!ls.length) {
        const emptyBlock = el('div', 'empty');
        emptyBlock.innerHTML = `<div style="font-size: 40px; margin-bottom: 10px;">😴</div><div style="font-weight: 700; font-size: 18px; margin-bottom: 6px;">Пар нет</div><div style="font-size: 14px; color: var(--mute);">На этот день расписание еще не выложили, либо занятий не предусмотрено.</div>`;
        app.appendChild(emptyBlock);
    } else {
        ls.forEach(l => app.appendChild(createLessonCard(l, day.weekday, key)));
    }
  } else if (mode === 'week') {
    const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)), sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    let list = dates.filter(k => k >= iso(mon) && k <= iso(sun)); if (!list.length) list = dates.slice(-7);
    list.forEach(k => { const d = data.days[k];
      app.appendChild(el('h2', null, cap(d.weekday) + ', ' + fmt(k))).style.cssText = 'margin: 20px 0 10px; font-size: 18px;';
      const ls = data.days[k].groups[group] || []; 
      if (!ls.length) {
          const emptyBlock = el('div', 'empty');
          emptyBlock.innerHTML = `<div style="font-size: 30px; margin-bottom: 5px;">😴</div><div style="font-weight: 700;">Пар нет</div>`;
          app.appendChild(emptyBlock);
      } else {
          ls.forEach(l => app.appendChild(createLessonCard(l, d.weekday, k)));
      }
    });
  } else if (mode === 'bells') {
    const todayWeekday = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][new Date().getDay()];
    const todayBells = bellsFor(todayWeekday);
    const now = new Date();
    const currentTime = now.getHours() * 60 + now.getMinutes();

    Object.entries(todayBells).forEach(([num, times]) => {
      const [start, end] = times;
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      const startMin = startH * 60 + startM;
      const endMin = endH * 60 + endM;
      
      let status = "";
      let isActive = false;
      
      if (currentTime >= startMin && currentTime <= endMin) {
          status = "Идет сейчас";
          isActive = true;
      } else if (currentTime < startMin) {
          status = "Скоро";
      } else {
          status = "Прошла";
      }

      const card = el('div', 'bell-card' + (isActive ? ' active' : ''));
      const numEl = el('div', 'bell-num', num);
      const timeEl = el('div', 'bell-times');
      timeEl.innerHTML = `<span>${start} – ${end}</span><span class="bell-duration">${(endMin - startMin)} минут</span>`;
      const statusEl = el('div', 'bell-status', status);
      if (isActive) {
          statusEl.style.background = 'var(--mark)';
          statusEl.style.color = 'var(--markink)';
      }
      card.append(numEl, timeEl, statusEl);
      app.appendChild(card);
    });
  } else if (mode === 'news') {
    const tgCard = document.createElement('a');
    tgCard.href = 'https://t.me/aask_shedule';
    tgCard.target = '_blank';
    tgCard.className = 'tg-card';
    tgCard.innerHTML = `
      <svg class="tg-icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      <div class="tg-text">
        <span class="tg-title">Наш Telegram-канал</span>
        <span class="tg-desc">Новости сайта и обновления расписания</span>
      </div>
    `;
    app.appendChild(tgCard);

    const quotes = [
      "У тебя всё получится! Главное — не сдаваться. 💪",
      "Знания — это сила. Хорошей учёбы! 📚",
      "Даже маленький шаг вперёд — это прогресс. 🚀",
      "Сегодня отличный день, чтобы узнать что-то новое. 🌟",
      "Ты справишься с любой сессией! Держись! 🔥",
      "Не забывай отдыхать. Твой мозг скажет спасибо. 🧠",
      "Ошибки — это часть пути к успеху. Не бойся их. 🛤️",
      "Ты молодец, что заботишься о своём расписании! 📅",
      "Верь в себя, и всё получится. ✨",
      "Каждая пара — это шаг к твоей будущей профессии. 🎓"
    ];
    const dayIndex = new Date().getDate() % quotes.length;
    const quoteCard = el('div', 'lesson'); 
    quoteCard.style.gridTemplateColumns = '1fr';
    quoteCard.style.background = 'var(--mark)';
    quoteCard.style.color = 'var(--markink)';
    quoteCard.style.border = 'none';
    const quoteContent = el('div');
    quoteContent.style.cssText = 'text-align: center; font-size: 17px; font-weight: 700; padding: 8px;';
    quoteContent.textContent = quotes[dayIndex];
    quoteCard.appendChild(quoteContent);
    app.appendChild(quoteCard);

    if (!data.news || !data.news.length) {
      app.appendChild(el('div', 'empty', 'Пока новостей нет.'));
    } else {
      data.news.forEach(n => {
        const c = el('div', 'lesson'); c.style.gridTemplateColumns = '1fr';
        const b = el('div'); 
        const d = el('div', null, n.date); d.style.cssText = 'font-size:13px; color:var(--steel); font-weight:700; margin-bottom:4px;';
        b.appendChild(d); b.appendChild(el('div', 'subject', n.text));
        c.appendChild(b); app.appendChild(c);
      });
    }
  }
}

// Безопасная загрузка
fetch('schedule.json?v=' + new Date().getTime())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    data = j;
    dates = Object.keys(j.days || {}).sort();
    data.groups = (j.groups || []).sort();
    const saved = localStorage.getItem('group');
    if (saved && data.groups.includes(saved)) group = saved;
    show();
  })
  .catch(e => {
    app.replaceChildren(el('div', 'empty', 'Ошибка загрузки данных: ' + e.message));
  });
</script>
</body>
</html>
