<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание · ААСК</title>
<meta name="theme-color" content="#1d2330">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AASK SCHEDULE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* --- БАЗОВЫЕ ПЕРЕМЕННЫЕ (СВЕТЛАЯ ТЕМА) --- */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --ink: #1d1d1f;
  --mute: #86868b;
  --line: #e5e5ea;
  --mark: #f2b705;
  --markink: #1d1d1f;
  --steel: #0071e3;
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --radius: 16px;
}

/* --- ТЕМНАЯ ТЕМА --- */
[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --ink: #f5f5f7;
  --mute: #86868b;
  --line: #38383a;
  --mark: #f2b705;
  --markink: #000000;
  --steel: #2997ff;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 Onest, system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
}

main { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; }

/* --- УВЕДОМЛЕНИЕ --- */
.notification {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--mark);
  color: var(--markink);
  padding: 14px 18px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 4px 12px rgba(242, 183, 5, 0.3);
  animation: slideDown 0.4s ease-out;
  border: 1px solid rgba(0,0,0,0.05);
}
.notification button {
  background: none;
  border: none;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  color: var(--markink);
  opacity: 0.6;
  padding: 0 4px;
  transition: opacity 0.2s;
}
.notification button:hover { opacity: 1; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- ТИПОГРАФИКА --- */
h1 { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px; }
.sub { margin-top: 6px; color: var(--mute); font-size: 15px; font-weight: 500; }

/* --- КНОПКИ --- */
button { font: inherit; cursor: pointer; color: inherit; border: none; background: none; transition: all 0.2s; }
button:active { transform: scale(0.97); }
.link { color: var(--steel); font-weight: 600; padding: 8px 0; display: inline-block; }
.link:hover { opacity: 0.8; }

.tabs {
  display: flex; gap: 4px; margin: 20px 0; padding: 4px;
  background: var(--line); border-radius: 12px;
}
.tabs button {
  flex: 1; padding: 10px; border-radius: 10px;
  color: var(--mute); font-weight: 600; font-size: 15px;
}
.tabs button[aria-selected="true"] {
  background: var(--card); color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.search {
  width: 100%; margin: 16px 0 12px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--ink); font: inherit;
  box-shadow: var(--shadow); transition: border 0.2s;
}
.search:focus { outline: none; border-color: var(--steel); }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.chips button {
  padding: 14px 8px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--card);
  font-weight: 600; box-shadow: var(--shadow);
}
.chips button:hover { border-color: var(--steel); }

/* --- ШАПКА ДНЯ --- */
.dayhead {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; margin-bottom: 12px;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.dayhead h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.dayhead small { display: block; color: var(--mute); font-weight: 500; font-size: 14px; margin-top: 2px; }

.nav { display: flex; gap: 8px; }
.nav button {
  width: 44px; height: 44px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--card);
  display: grid; place-items: center; font-size: 20px;
  box-shadow: var(--shadow);
}
.nav button:disabled { opacity: 0.3; cursor: default; box-shadow: none; }

/* --- КАРТОЧКА ПАРЫ --- */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.lesson {
  display: grid; grid-template-columns: 56px 1fr; gap: 16px;
  padding: 16px; margin-bottom: 10px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: slideUp 0.3s ease-out forwards;
  border: 1px solid var(--line);
}
.lesson:hover { border-color: var(--mute); }

.num {
  display: grid; place-items: center; height: 56px;
  border-radius: 12px; background: var(--mark); color: var(--markink);
  font-size: 24px; font-weight: 800;
}

.subject { font-weight: 600; font-size: 17px; line-height: 1.3; margin-bottom: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--mute); font-size: 14px; }

/* Иконки и плашки */
.icon { width: 16px; height: 16px; fill: currentColor; opacity: 0.7; margin-right: 4px; vertical-align: text-bottom; }
.room {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 8px;
  background: var(--line); color: var(--ink); font-weight: 600; font-size: 13px;
}
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 8px;
  background: rgba(0, 113, 227, 0.1); color: var(--steel);
  font-weight: 600; font-size: 13px;
}

/* --- ПУСТЫЕ СОСТОЯНИЯ --- */
.note, .empty {
  padding: 20px; border-radius: var(--radius);
  background: var(--card); color: var(--mute);
  text-align: center; font-weight: 500;
  box-shadow: var(--shadow); margin-bottom: 16px;
}

/* --- ПЕРЕКЛЮЧАТЕЛЬ ТЕМ --- */
.theme-toggle {
  position: absolute; top: 20px; right: 20px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 20px;
  z-index: 20;
}

/* --- ПОДВАЛ --- */
footer { margin-top: 40px; font-size: 13px; color: var(--mute); text-align: center; line-height: 1.6; }
footer a { color: var(--steel); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* Адаптив */
@media (max-width: 400px) {
  h1 { font-size: 26px; }
  .lesson { grid-template-columns: 48px 1fr; padding: 12px; }
  .num { height: 48px; font-size: 20px; }
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>

<main>
  <!-- Блок для уведомления -->
  <div id="notification-banner" class="notification" style="display: none;">
    <span>🎉 Появилось расписание на новый день!</span>
    <button onclick="document.getElementById('notification-banner').style.display='none'">✕</button>
  </div>

  <h1 id="title">Расписание ААСК</h1>
  <p class="sub" id="sub">Алтайский архитектурно-строительный колледж</p>
  
  <div id="app" aria-live="polite"><div class="empty">Загружаю расписание…</div></div>
  
  <footer>
    Источник — файлы расписания на <a href="https://altask.ru/index.php/staff" rel="noopener">сайте колледжа</a>.<br>
    Перед занятиями сверяйтесь с официальным расписанием.<span id="upd"></span>
  </footer>
</main>

<script>
// --- ЛОГИКА ТЕМЫ ---
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme');
if (currentTheme) {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  themeToggle.textContent = isDark ? '🌙' : '☀️';
});

// --- ЗВОНКИ ---
const BELLS = {
  mon: {1:['8:45','10:15'],2:['10:25','12:05'],3:['12:50','14:20'],4:['14:40','16:10'],5:['16:15','17:45']},
  std: {1:['8:00','9:30'],2:['9:35','11:15'],3:['11:35','13:15'],4:['13:35','15:05'],5:['15:25','16:55'],6:['17:00','18:30']}
};
const bellsFor = w => w === 'понедельник' ? BELLS.mon : (['суббота','воскресенье'].includes(w) ? {} : BELLS.std);

// --- ХЕЛПЕРЫ ---
const LAT = {a:'а',c:'с',e:'е',p:'р',o:'о',x:'х',k:'к',m:'м',t:'т',b:'в',h:'н'};
const norm = s => s.toLowerCase().replace(/[^a-zа-яё0-9]/g,'').replace(/[acepoxkmtbh]/g, ch => LAT[ch]);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.innerHTML = x; return e; };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

// --- ИКОНКИ ---
const ICONS = {
  room: '<svg class="icon" viewBox="0 0 24 24"><path d="M19 19V4a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v15H3v2h18v-2h-2zm-7-9a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg>',
  teacher: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  subgroup: '<svg class="icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>'
};

// --- ОСНОВНАЯ ЛОГИКА ---
const app = document.getElementById('app');
let data, group = null, mode = 'day', dates = [], idx = 0;

function pickGroup(g){
  group = g; store.set('group', g);
  try { history.replaceState(null, '', '#' + encodeURIComponent(g)); } catch(e){}
  mode = 'day'; idx = Math.max(0, dates.findIndex(k => k >= iso(new Date())));
  if (idx === -1) idx = dates.length - 1;
  show();
}
function resetGroup(){ group = null; try { history.replaceState(null, '', location.pathname); } catch(e){} show(); }

function picker(){
  document.getElementById('title').textContent = 'Расписание ААСК';
  document.getElementById('sub').style.display = 'block';
  app.replaceChildren();
  app.appendChild(el('p', 'sub', 'Выберите свою группу — сайт запомнит выбор.'));
  const inp = el('input', 'search'); inp.type = 'search'; inp.placeholder = 'Найдите группу (например, ЗУ-31)'; inp.setAttribute('aria-label','Поиск группы');
  const chips = el('div', 'chips');
  const draw = () => {
    const q = norm(inp.value); chips.replaceChildren();
    const list = data.groups.filter(g => norm(g).includes(q));
    list.forEach(g => { const b = el('button', null, g); b.onclick = () => pickGroup(g); chips.appendChild(b); });
    if (!list.length) chips.appendChild(el('div','empty','Такой группы нет в расписании.'));
  };
  inp.oninput = draw; app.append(inp, chips); draw();
}

function lessonCard(l, weekday){
  const c = el('div','lesson'); c.appendChild(el('div','num',l.n));
  const b = el('div'), bl = bellsFor(weekday)[l.n];
  
  if (bl) {
    const time = el('div', 'time', bl[0] + '–' + bl[1]);
    time.style.cssText = 'font-size:13px; color:var(--steel); font-weight:700; margin-bottom:4px;';
    b.appendChild(time);
  }
  
  const s = el('div','subject', l.s);
  if (l.p) {
    const tag = el('span', 'tag', ICONS.subgroup + ' подгруппа');
    s.appendChild(tag);
  }
  b.appendChild(s);
  
  const m = el('div','meta');
  if (l.r) m.appendChild(el('span', 'room', ICONS.room + ' ' + l.r));
  if (l.t) {
    const t = el('span', null, ICONS.teacher + ' ' + l.t);
    t.style.cssText = 'display:inline-flex; align-items:center; gap:4px;';
    m.appendChild(t);
  }
  b.appendChild(m);
  c.appendChild(b); return c;
}
const lessonsOf = k => (data.days[k].groups[group] || []);

function schedule(){
  document.getElementById('title').textContent = 'Расписание ' + group;
  document.getElementById('sub').style.display = 'none';
  app.replaceChildren();
  
  const ch = el('button','link','← Сменить группу'); ch.onclick = resetGroup; app.appendChild(ch);
  
  const tabs = el('div','tabs'); tabs.setAttribute('role','tablist');
  [['day','Сегодня'],['week','Неделя']].forEach(([m,t]) => {
    const b = el('button',null,t); b.setAttribute('role','tab'); b.setAttribute('aria-selected', mode === m);
    b.onclick = () => { mode = m; schedule(); }; tabs.appendChild(b);
  });
  app.appendChild(tabs);
  
  if (!dates.length){ app.appendChild(el('div','empty','В расписании пока нет ни одного дня.')); return; }
  const t = iso(new Date());
  
  if (mode === 'day'){
    const key = dates[idx], day = data.days[key];
    if (key !== t) app.appendChild(el('div','note', key > t ? 'На сегодня файла с расписанием нет. Показываю ближайший день.' : 'Расписание на сегодня ещё не загружено. Показываю последний загруженный день.'));
    
    const head = el('div','dayhead'), h = el('h2', null, cap(day.weekday) + ', ' + fmt(key));
    h.appendChild(el('small', null, day.week + '-я неделя')); head.appendChild(h);
    
    const nav = el('div','nav'), p = el('button',null,'‹'), n = el('button',null,'›');
    p.setAttribute('aria-label','Предыдущий день'); n.setAttribute('aria-label','Следующий день');
    p.disabled = idx === 0; n.disabled = idx >= dates.length - 1; 
    p.onclick = () => { idx--; schedule(); }; n.onclick = () => { idx++; schedule(); };
    nav.append(p, n); head.appendChild(nav); app.appendChild(head);
    
    const ls = lessonsOf(key);
    if (!ls.length) app.appendChild(el('div','empty','У группы ' + group + ' в этот день занятий нет.'));
    ls.forEach(l => app.appendChild(lessonCard(l, day.weekday)));
  } else {
    const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)), sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    let list = dates.filter(k => k >= iso(mon) && k <= iso(sun)); if (!list.length) list = dates.slice(-7);
    const w = el('div','week');
    list.forEach(k => { const d = data.days[k];
      const h2 = el('h2', null, cap(d.weekday) + ', ' + fmt(k) + (k === t ? ' — сегодня' : ''));
      h2.style.cssText = 'margin: 24px 0 12px; font-size: 18px; font-weight: 700;' + (k === t ? 'color: var(--steel);' : '');
      w.appendChild(h2);
      const ls = lessonsOf(k); if (!ls.length) w.appendChild(el('div','empty','Занятий нет.'));
      ls.forEach(l => w.appendChild(lessonCard(l, d.weekday))); });
    app.appendChild(w);
  }
}
const show = () => group ? schedule() : picker();

// --- ЗАГРУЗКА ДАННЫХ И УВЕДОМЛЕНИЯ ---
fetch('schedule.json', {cache:'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    data = j; dates = Object.keys(j.days).sort();
    data.groups = j.groups.slice().sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
    
    if (j.updated) {
        document.getElementById('upd').innerHTML = '<br><span style="font-size:12px;opacity:0.7;">Обновлено: ' + new Date(j.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) + '</span>';
    }

    // --- ЛОГИКА УВЕДОМЛЕНИЙ О НОВОМ ДНЕ ---
    if (dates.length > 0) {
      const latestDate = dates[dates.length - 1]; // Самый новый день
      const lastSeenDate = localStorage.getItem('lastSeenScheduleDate');
      
      if (!lastSeenDate) {
        // Первый заход, просто запоминаем
        localStorage.setItem('lastSeenScheduleDate', latestDate);
      } else if (lastSeenDate !== latestDate) {
        // Появился новый день!
        const banner = document.getElementById('notification-banner');
        if (banner) {
          const [y, m, d] = latestDate.split('-').map(Number);
          const dateStr = new Date(y, m-1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
          
          banner.querySelector('span').textContent = `🎉 Появилось расписание на ${dateStr}!`;
          banner.style.display = 'flex';
        }
        // Запоминаем новую дату
        localStorage.setItem('lastSeenScheduleDate', latestDate);
      }
    }
    // ----------------------------------------

    let g = null; try { g = decodeURIComponent(location.hash.slice(1)); } catch(e){}
    if (!g || !data.groups.includes(g)) g = store.get('group');
    if (g && data.groups.includes(g)) pickGroup(g); else show();
  })
  .catch(() => app.replaceChildren(el('div','empty','Не удалось загрузить расписание. Обновите страницу позже.')));
</script>
</body>
</html>
