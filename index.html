<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание · ААСК</title>
<meta name="theme-color" content="#1d2330">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AASK SCHEDULE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e6e1;--card:#f6f5f2;--ink:#1d2330;--mute:#5d6472;--line:#cfccc4;--mark:#f2b705;--markink:#1d2330;--steel:#2f4b6e}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--card:#1d2330;--ink:#ecebe7;--mute:#9aa1ae;--line:#2c3446;--markink:#141922;--steel:#8fb0d8}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:800}
.sub{margin:4px 0 0;color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.link{border:0;background:none;color:var(--steel);font-weight:700;padding:6px 0}
.tabs{display:flex;gap:4px;margin:16px 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:9px;background:none;color:var(--mute);font-weight:700}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.search{width:100%;margin:16px 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chips button{padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dayhead h2{margin:0;font-size:20px;font-weight:700}
.dayhead small{display:block;color:var(--mute);font-weight:400;font-size:14px}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px}
.nav button:disabled{opacity:.35;cursor:default}
.lesson{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.num{display:grid;place-items:center;height:52px;border-radius:10px;background:var(--mark);color:var(--markink);font-size:26px;font-weight:800}
.subject{font-weight:700;line-height:1.25}
.meta{margin-top:4px;color:var(--mute);font-size:14px}
.room{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}
.tag{margin-left:6px;font-size:12px;color:var(--steel);font-weight:700}
.time{font-size:13px;color:var(--steel);font-weight:700;margin-bottom:2px}
.note,.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--mute)}
.note{margin-bottom:12px;border-style:solid;background:var(--card)}
.week h2{margin:22px 0 8px;font-size:17px}.week h2:first-child{margin-top:0}.week h2.today{color:var(--steel)}
footer{margin-top:28px;font-size:13px;color:var(--mute)}footer a{color:var(--steel)}
</style>
</head>
<body>
<main>
<h1 id="title">Расписание ААСК</h1>
<p class="sub" id="sub">Алтайский архитектурно-строительный колледж</p>
<div id="app" aria-live="polite"><div class="empty">Загружаю расписание…</div></div>
<footer>Источник — файлы расписания на <a href="https://altask.ru/index.php/staff" rel="noopener">сайте колледжа</a>. Перед занятиями сверяйтесь с официальным расписанием.<span id="upd"></span></footer>
</main>
<script>
// Звонки 2026–2027: начало и конец пары целиком (у 2-й и 3-й пар внутри есть перемена 10 минут).
const BELLS = {
  mon: {1:['8:45','10:15'],2:['10:25','12:05'],3:['12:50','14:20'],4:['14:40','16:10'],5:['16:15','17:45']},
  std: {1:['8:00','9:30'],2:['9:35','11:15'],3:['11:35','13:15'],4:['13:35','15:05'],5:['15:25','16:55'],6:['17:00','18:30']}
};
const bellsFor = w => w === 'понедельник' ? BELLS.mon : (['суббота','воскресенье'].includes(w) ? {} : BELLS.std);
const LAT = {a:'а',c:'с',e:'е',p:'р',o:'о',x:'х',k:'к',m:'м',t:'т',b:'в',h:'н'};
const norm = s => s.toLowerCase().replace(/[^a-zа-яё0-9]/g,'').replace(/[acepoxkmtbh]/g, ch => LAT[ch]);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); };
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const app = document.getElementById('app');
let data, group = null, mode = 'day', dates = [], idx = 0;

function pickGroup(g){
  group = g; store.set('group', g);
  try { history.replaceState(null, '', '#' + encodeURIComponent(g)); } catch(e){}
  mode = 'day'; idx = Math.max(0, dates.findIndex(k => k >= iso(new Date())));
  if (idx === -1) idx = dates.length - 1;
  show();
}
function resetGroup(){ group = null; try { history.replaceState(null, '', location.pathname); } catch(e){} show(); }

function picker(){
  document.getElementById('title').textContent = 'Расписание ААСК';
  app.replaceChildren();
  app.appendChild(el('p', 'sub', 'Выберите свою группу — сайт запомнит выбор.'));
  const inp = el('input', 'search'); inp.type = 'search'; inp.placeholder = 'Найдите группу, например ЗУ-31'; inp.setAttribute('aria-label','Поиск группы');
  const chips = el('div', 'chips');
  const draw = () => {
    const q = norm(inp.value); chips.replaceChildren();
    const list = data.groups.filter(g => norm(g).includes(q));
    list.forEach(g => { const b = el('button', null, g); b.onclick = () => pickGroup(g); chips.appendChild(b); });
    if (!list.length) chips.replaceWith(Object.assign(chips, {})), chips.appendChild(el('div','empty','Такой группы нет в расписании.'));
  };
  inp.oninput = draw; app.append(inp, chips); draw();
}

function lessonCard(l, weekday){
  const c = el('div','lesson'); c.appendChild(el('div','num',l.n));
  const b = el('div'), bl = bellsFor(weekday)[l.n];
  if (bl) b.appendChild(el('div','time',bl[0] + '–' + bl[1]));
  const s = el('div','subject',l.s); if (l.p) s.appendChild(el('span','tag','подгруппа')); b.appendChild(s);
  const m = el('div','meta'); if (l.r) m.appendChild(el('span','room','ауд. ' + l.r)); m.appendChild(document.createTextNode(l.t || '')); b.appendChild(m);
  c.appendChild(b); return c;
}
const lessonsOf = k => (data.days[k].groups[group] || []);

function schedule(){
  document.getElementById('title').textContent = 'Расписание ' + group;
  app.replaceChildren();
  const ch = el('button','link','Сменить группу'); ch.onclick = resetGroup; app.appendChild(ch);
  const tabs = el('div','tabs'); tabs.setAttribute('role','tablist');
  [['day','Сегодня'],['week','Неделя']].forEach(([m,t]) => {
    const b = el('button',null,t); b.setAttribute('role','tab'); b.setAttribute('aria-selected', mode === m);
    b.onclick = () => { mode = m; schedule(); }; tabs.appendChild(b);
  });
  app.appendChild(tabs);
  if (!dates.length){ app.appendChild(el('div','empty','В расписании пока нет ни одного дня.')); return; }
  const t = iso(new Date());
  if (mode === 'day'){
    const key = dates[idx], day = data.days[key];
    if (key !== t) app.appendChild(el('div','note', key > t ? 'На сегодня файла с расписанием нет. Показываю ближайший день.' : 'Расписание на сегодня ещё не загружено. Показываю последний загруженный день.'));
    const head = el('div','dayhead'), h = el('h2', null, cap(day.weekday) + ', ' + fmt(key));
    h.appendChild(el('small', null, day.week + '-я неделя')); head.appendChild(h);
    const nav = el('div','nav'), p = el('button',null,'‹'), n = el('button',null,'›');
    p.setAttribute('aria-label','Предыдущий день'); n.setAttribute('aria-label','Следующий день');
    p.disabled = idx === 0; n.disabled = idx === dates.length - 1;
    p.onclick = () => { idx--; schedule(); }; n.onclick = () => { idx++; schedule(); };
    nav.append(p, n); head.appendChild(nav); app.appendChild(head);
    const ls = lessonsOf(key);
    if (!ls.length) app.appendChild(el('div','empty','У группы ' + group + ' в этот день занятий нет.'));
    ls.forEach(l => app.appendChild(lessonCard(l, day.weekday)));
  } else {
    const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)), sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    let list = dates.filter(k => k >= iso(mon) && k <= iso(sun)); if (!list.length) list = dates.slice(-7);
    const w = el('div','week');
    list.forEach(k => { const d = data.days[k];
      w.appendChild(el('h2', k === t ? 'today' : '', cap(d.weekday) + ', ' + fmt(k) + (k === t ? ' — сегодня' : '')));
      const ls = lessonsOf(k); if (!ls.length) w.appendChild(el('div','empty','Занятий нет.'));
      ls.forEach(l => w.appendChild(lessonCard(l, d.weekday))); });
    app.appendChild(w);
  }
}
const show = () => group ? schedule() : picker();

fetch('schedule.json', {cache:'no-cache'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    data = j; dates = Object.keys(j.days).sort();
    data.groups = j.groups.slice().sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
    if (j.updated) document.getElementById('upd').textContent = ' Обновлено: ' + new Date(j.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) + '.';
    let g = null; try { g = decodeURIComponent(location.hash.slice(1)); } catch(e){}
    if (!g || !data.groups.includes(g)) g = store.get('group');
    if (g && data.groups.includes(g)) pickGroup(g); else show();
  })
  .catch(() => app.replaceChildren(el('div','empty','Не удалось загрузить расписание. Обновите страницу позже.')));
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(err => {
      console.warn("Не удалось зарегистрировать Service Worker:", err);
    });
  });
}
</script>
</body>
</html>
